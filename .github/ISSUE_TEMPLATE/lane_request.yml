name: Lane request
description: Ask for a new provider or model lane.
labels: ["lane"]
body:
  - type: input
    id: cli
    attributes:
      label: CLI name and where to get it
    validations:
      required: true
  - type: textarea
    id: signin
    attributes:
      label: How it signs in
      description: Browser login, API key in an environment variable, config file, and so on. Do not paste real keys.
    validations:
      required: true
  - type: input
    id: noninteractive
    attributes:
      label: Non-interactive flag
      description: "The flag or subcommand that runs one prompt and exits (for example `-p` or `exec`)."
    validations:
      required: true
  - type: dropdown
    id: readonly
    attributes:
      label: Does it have a read-only mode?
      options:
        - "Yes, enforced by a sandbox or flag"
        - "No, it can edit files in print mode"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: errors
    attributes:
      label: Known limit and auth error texts
      description: The exact messages for quota or rate limit, expired sign-in and unknown model, so the classifier can map them to limit, auth and model.
      render: text
  - type: textarea
    id: models
    attributes:
      label: Models worth routing to, and for which jobs
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, personal data and private code from everything I pasted.
          required: true
