name: Skill improvement
description: Propose a change to routing, brief rules or policy.
labels: ["skill"]
body:
  - type: dropdown
    id: skill
    attributes:
      label: Which skill
      options:
        - orchestra
        - council
        - chatgpt-lane
        - kimi-lane
        - deepseek-lane
        - otomode
        - other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What goes wrong today
      description: A concrete case where the current routing, brief or policy gave a bad result.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Benchmark numbers, status headers or a failing check that backs the proposal.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, personal data and private code from everything I pasted.
          required: true
