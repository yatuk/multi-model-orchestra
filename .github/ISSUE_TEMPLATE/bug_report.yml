name: Bug report
description: Something in the runner, a lane, the council, otomode or the installer misbehaves.
labels: ["bug"]
body:
  - type: dropdown
    id: lane
    attributes:
      label: Lane or provider
      options:
        - Claude sub-agent
        - Codex / GPT
        - Kimi
        - DeepSeek
        - council
        - otomode
        - install
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: CLI versions
      description: Output of `codex --version`, `kimi --version` and `claude --version` (only the ones that matter).
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows (Git Bash)
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: header
    attributes:
      label: mmo-run header line
      description: "The first line of the output file, for example `<!-- mmo provider=kimi model=... mode=rw status=failed exit=3 seconds=12 -->`."
      placeholder: "<!-- mmo provider=... status=... -->"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Commands you ran and what you saw. Trim logs to the relevant lines.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, personal data and private code from everything I pasted.
          required: true
