name: test

on:
  push:
    paths:
      - "skills/**"
      - "bench/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "skills/**"
      - "bench/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: otomode tests
        run: python -m pytest skills/otomode/scripts skills/orchestra/scripts/test_mmo_model_guard.py skills/orchestra/scripts/test_mmo_limit.py -q
      - name: Runner, checker and lane tests
        run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
          git config --global init.defaultBranch main
          for t in classify run check lessons lanes-1 lanes-2 api cloud roster lanes-3 score advise usage tiers; do
            echo "== $t"; bash skills/orchestra/scripts/test-mmo-$t.sh || exit 1
          done
      - name: Benchmark tests
        run: |
          echo "== bench parse"; bash bench/test-run-parse.sh || exit 1
          echo "== bench grade"; bash bench/test-grade.sh || exit 1
      - name: Python syntax
        run: python -m py_compile skills/orchestra/scripts/mmo_loop.py
      - name: Shell syntax
        run: |
          for f in skills/orchestra/scripts/mmo-* skills/orchestra/scripts/test-mmo-*.sh \
                   skills/orchestra/scripts/providers/*.sh bench/run.sh bench/test-run-parse.sh \
                   bench/test-grade.sh install.sh; do
            bash -n "$f" && echo "ok $f" || exit 1
          done
